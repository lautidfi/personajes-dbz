<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Personajes de Dragon Ball Z</title>
   <link rel="icon" href="/assets/images/favicon.ico">
   <link rel="stylesheet" href="/assets/css/styles.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Exo:wght@500;600;700&display=swap" rel="stylesheet">
	<script defer src="/assets/js/index.js"></script>
</head>
<body>
   <header class="site-header">
      <div class="header-branding">
         <span class="header-title">PERSONAJES DE</span>
         <img class="header-logo" src="/assets/images/logo.png" alt="Dragon Ball Z">
      </div>
   </header>
   <main class="main-container">
      <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
         <source src="/assets/videos/background.webm" type="video/webm">
      </video>
      <section class="cards-container" aria-label="Personajes">
         <p class="loading-status" role="status" aria-live="polite">Cargando personajes...</p>
         <button class="retry-button" type="button" hidden>Reintentar</button>
         <div class="cards-grid"></div>
      </section>
   </main>
</body>
</html>
